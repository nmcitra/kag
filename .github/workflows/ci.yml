name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-hygiene.sh

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit in the PR carries a DCO sign-off
        run: |
          set -euo pipefail
          missing=0
          # Merge commits (e.g. GitHub "Update branch") carry no authored change and are
          # discarded by squash merge, so only non-merge commits need a sign-off.
          for sha in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: .* <.*>'; then
              echo "::error::missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"; missing=1
            fi
          done
          [ "$missing" -eq 0 ] && echo "DCO: all commits signed off"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
        if: hashFiles('go.mod') != ''
      - name: Format, vet, test, race
        run: |
          if [ ! -f go.mod ]; then echo "no go.mod yet"; exit 0; fi
          test -z "$(gofmt -l . | tee /dev/stderr)" || { echo "::error::gofmt: files above need formatting"; exit 1; }
          go vet ./...
          go test ./...
          go test -race ./...
